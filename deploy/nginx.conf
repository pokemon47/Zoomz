worker_processes auto;
pid /tmp/zoomz-nginx/nginx.pid;
error_log stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Do not open the packaged default /var/log/nginx/access.log.
    # The server config explicitly enables privacy-safe stdout logging.
    access_log off;
    # All compiled-in HTTP modules initialize their temp paths, even unused ones.
    client_body_temp_path /tmp/zoomz-nginx/client-body;
    proxy_temp_path /tmp/zoomz-nginx/proxy;
    fastcgi_temp_path /tmp/zoomz-nginx/fastcgi;
    uwsgi_temp_path /tmp/zoomz-nginx/uwsgi;
    scgi_temp_path /tmp/zoomz-nginx/scgi;
    include /tmp/zoomz-nginx/server.conf;
}
