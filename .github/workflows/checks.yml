name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zoomz
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: zoomz
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zoomz -d zoomz"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.lock -r backend/requirements-dev.txt
      - name: SQLite tests
        working-directory: backend
        run: python -m pytest -q
      - name: PostgreSQL migrations and tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://zoomz:ci-only-password@localhost:5432/zoomz
          TEST_DATABASE_URL: postgresql+psycopg://zoomz:ci-only-password@localhost:5432/zoomz
        run: |
          alembic upgrade head
          alembic check
          python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run lint -- src
          npm run build
          npm audit --omit=dev --audit-level=high
      - name: Validate published Zenith manifest
        run: |
          npm install --prefix "$RUNNER_TEMP/zenith-validator" --no-audit --no-fund @zenith-hosting/cli@0.1.4
          ZENITH_NODE_MODULES="$RUNNER_TEMP/zenith-validator/node_modules" node deploy/check_manifest.mjs
      - name: Build and smoke-test production containers
        run: |
          cp .env.production.example .env.production
          chmod 600 .env.production
          # Disposable CI values, not deployment credentials. No real email is sent.
          echo 'SECRET_KEY=ci-only-secret-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx' >> .env.production
          echo 'POSTGRES_PASSWORD=ci-only-password' >> .env.production
          echo 'DATABASE_URL=postgresql+psycopg://zoomz:ci-only-password@db:5432/zoomz' >> .env.production
          echo 'SMTP_HOST=smtp.invalid' >> .env.production
          echo 'SMTP_FROM=sender@example.com' >> .env.production
          docker compose --env-file .env.production -p zoomz-ci -f compose.production.yml config -q
          docker compose --env-file .env.production -p zoomz-ci -f compose.production.yml up -d --build --wait --wait-timeout 180
          curl --fail http://127.0.0.1:8080/api/health
          curl --fail http://127.0.0.1:8080/demo
          curl --fail http://127.0.0.1:8080/api/demo-board
          docker compose --env-file .env.production -p zoomz-ci -f compose.production.yml exec -T -e ZOOMZ_CONTAINER_TEST=1 app python - seed < deploy/container_check.py
          docker compose --env-file .env.production -p zoomz-ci -f compose.production.yml restart app
          docker compose --env-file .env.production -p zoomz-ci -f compose.production.yml up -d --wait --wait-timeout 120
          docker compose --env-file .env.production -p zoomz-ci -f compose.production.yml exec -T -e ZOOMZ_CONTAINER_TEST=1 app python - verify < deploy/container_check.py
          python deploy/backup.py --project zoomz-ci backup /tmp/zoomz-ci-backups
          docker compose --env-file .env.production -p zoomz-ci -f compose.production.yml stop app
          docker compose --env-file .env.production -p zoomz-restore -f compose.production.yml build
          python deploy/backup.py --project zoomz-restore restore /tmp/zoomz-ci-backups/zoomz-backup-*.tar --confirm-empty-target
          docker compose --env-file .env.production -p zoomz-restore -f compose.production.yml up -d --wait --wait-timeout 120
          docker compose --env-file .env.production -p zoomz-restore -f compose.production.yml exec -T -e ZOOMZ_CONTAINER_TEST=1 app python - verify < deploy/container_check.py
      - name: Remove disposable CI containers
        if: always()
        run: |
          if [ -f .env.production ]; then
            docker compose --env-file .env.production -p zoomz-ci -f compose.production.yml down -v
            docker compose --env-file .env.production -p zoomz-restore -f compose.production.yml down -v
          fi
