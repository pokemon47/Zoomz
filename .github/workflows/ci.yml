name: CI

on:
  push:
    branches: [main, bao-foundation]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zoomz
          POSTGRES_PASSWORD: zoomz
          POSTGRES_DB: zoomz_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zoomz" --health-interval 3s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests (SQLite)
        run: python -m pytest -q
      - name: Migrations apply cleanly to Postgres
        env:
          DATABASE_URL: postgresql+psycopg://zoomz:zoomz@localhost:5432/zoomz_test
        run: alembic upgrade head && alembic check
      - name: Tests (Postgres)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://zoomz:zoomz@localhost:5432/zoomz_test
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: npx oxlint src
      - run: npm run build

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml
      - run: python scripts/check-zenith.py
      - run: docker compose -f zenith-compose.yml config --quiet

  images:
    # Publish the images zenith-compose.yml points at.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [backend, frontend, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: zoomz-api
            context: backend
          - name: zoomz-web
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
